name = "github-topic-radar-oauth"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Set secrets (do NOT put them here):
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put GITHUB_PAT   # optional, raises collector rate limit

[vars]
ALLOWED_ORIGIN = "chrome-extension://jlillemjommikolcmnlbnoeegmbcpold"

# Shared trend collector runs hourly.
[triggers]
crons = ["0 * * * *"]

# KV namespace for star snapshots. Create it once, then paste the id here:
#   npx wrangler kv namespace create TREND
[[kv_namespaces]]
binding = "TREND"
id = "76caa0aeeb6747e493f633ec13b5c1d1"

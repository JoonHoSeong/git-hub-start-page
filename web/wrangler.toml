name = "github-topic-radar-web"
compatibility_date = "2024-11-01"

# Static site (built by `npm run build:web` into web/dist). No Worker code
# needed for a pure static app — Cloudflare serves the assets directly.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# After the first `npx wrangler deploy` from this directory, add the custom
# domain in the Cloudflare dashboard (Workers & Pages > this worker > Settings
# > Domains & Routes > Add > Custom domain), or uncomment and adjust:
# [[routes]]
# pattern = "github-radar.slothprogrammer.cloud/*"
# custom_domain = true

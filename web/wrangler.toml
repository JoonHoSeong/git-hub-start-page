name = "github-topic-radar-web"
compatibility_date = "2024-11-01"

# Static site (built by `npm run build:web` into web/dist). No Worker code
# needed for a pure static app — Cloudflare serves the assets directly.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain for the deployed static site.
[[routes]]
pattern = "github-radar.slothprogrammer.cloud"
custom_domain = true
